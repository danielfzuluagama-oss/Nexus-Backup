name: Validate Skills

on:
  pull_request:
    paths:
      - "agents/**/skill.yaml"
      - "src/scripts/validate-ecosystem-skills.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-skills.yml"
  push:
    branches:
      - main
    paths:
      - "agents/**/skill.yaml"
      - "src/scripts/validate-ecosystem-skills.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-skills.yml"

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:skills
