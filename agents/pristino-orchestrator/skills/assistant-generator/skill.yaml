id: "assistant-generator"
name: "AI Assistant Factory (v2.1-GAMMA)"
version: "2.1.0"
description: "ENTRUSTED-certified meta-cognitive engine for designing, auditing, evolving, and repairing AI assistants and system prompts. Enforces UX methodologies (Krug's Laws), Multi-LLM routing optimization, and 5 Quality Gates before certification."
owner: "agent_orchestrator"
category: "meta-cognitive"

business_value: |
  Eliminates prompt decay and inconsistent assistant behavior across the ecosystem.
  Reduces assistant creation time from days to hours while guaranteeing ≥9.5/10 quality
  by enforcing structural rigor (Identity, Capabilities, Constraints, Evaluation) on every artifact.

triggers:
  - keywords: ["crear asistente", "generar asistente", "prompt de sistema", "system prompt", "revisar asistente", "mejorar asistente", "corregir asistente"]
  - context_patterns:
      - pattern: "(?i)(crear|diseñar|generar).* (asistente|assistant|agente|prompt)"
      - pattern: "(?i)(revisar|auditar|evolucionar|reparar).* (asistente|assistant|prompt)"

dependencies:
  skills:
    - "prompt-engineer"    # Algebraic composition of PE primitives for prompt construction.
    - "quality-excellence"  # 16D scoring + Adversarial+ testing for certification.

# ── Assumptions ──
assumptions:
  - "Target LLM supports system prompts (GPT-4, Claude, Gemini, Groq). Assistants for non-chat models require manual adaptation."
  - "User provides sufficient context about the assistant's domain. Missing context triggers clarification, not guessing."
  - "Output format is always Markdown system prompt unless user explicitly requests YAML or JSON."
  - "Single-turn assistants are the default scope. Multi-turn stateful assistants require explicit 'stateful: true' flag."

# ── Limits ──
limits:
  - "Cannot generate binary executables, APIs, or deployable code — output is prompt architecture only."
  - "Cannot self-test the generated assistant against a live LLM. Validation is structural, not runtime."
  - "Maximum system prompt length: 8,000 tokens. Beyond that, the skill recommends decomposition into sub-agents."
  - "Does not handle fine-tuning, RLHF, or model training. Scope is strictly prompt engineering."

# ── 4 Universal Operations ──
capabilities:
  universal_operations:
    CREATE:
      signature: "UserBrief → SystemPrompt (≥9.5/10)"
      workflow: "DISCOVER >>> ARCHITECT (ToT 3-5 branches) >>> DRAFT >>> VALIDATE (5 Gates) >>> CERTIFY"
      output: "Complete system prompt with Identity, Capabilities, Constraints, Workflows, and Evaluation sections."
    REVIEW:
      signature: "ExistingPrompt → AuditReport"
      layers: "Security (injection vectors) → Quality (16D) → Architecture (structural gaps) → Completeness (missing sections)"
      output: "Scored report with pass/fail per layer and specific improvement recommendations."
    EVOLVE:
      signature: "Prompt + EvolutionSpec → EnhancedPrompt"
      types: "Add (new capabilities), Improve (quality), Optimize (token reduction), Expand (scope)"
      constraint: "EVOLVE always runs REVIEW first to establish baseline. No blind evolution."
    REPAIR:
      signature: "BrokenPrompt + Symptoms → FixedPrompt"
      workflow: "DIAGNOSE (symptom analysis) >>> ROOT_CAUSE (ToT) >>> PATCH >>> VALIDATE"
      common_symptoms: "Hallucinations, format breaks, personality drift, instruction leaking, safety bypass"

# ── UX Methodology ──
ux_enforcement:
  krugs_laws:
    law1: "Don't make me think — assistant instructions must be self-evident to the LLM."
    law2: "Number of sections doesn't matter if each section is mindless to parse."
    law3: "Get rid of half the words, then half again. Concision is a quality metric."
  multi_llm_routing:
    strategy: "Prompts are designed LLM-agnostic by default. Provider-specific optimizations (e.g., Claude XML tags, GPT function calling) applied only via explicit `target_llm` parameter."

# ── 5 Quality Gates ──
quality_gates:
  - gate: "G1: Structural Completeness"
    check: "All 6 canonical sections present (Identity, Capabilities, Constraints, Workflows, Evaluation, Safety)."
  - gate: "G2: Security Scan"
    check: "No injection vectors, no PII in examples, no hardcoded credentials."
  - gate: "G3: Clarity Score"
    check: "Krug's Law 3 applied — every instruction sentence justifies its existence."
  - gate: "G4: Behavioral Consistency"
    check: "No contradictions between Capabilities and Constraints sections."
  - gate: "G5: Adversarial Robustness"
    check: "Prompt resists 3 standard injection attempts (ignore previous, role-play escape, system prompt leak)."

workflows:
  - id: "wflow_assistant_creation"
    name: "Full Assistant Creation Pipeline"
    steps:
      - "1. Discovery: Extract domain, audience, tone, constraints, and success criteria from user brief."
      - "2. Architecture: ToT exploration of 3-5 structural approaches. Select optimal architecture."
      - "3. Drafting: Generate full system prompt using canonical 6-section structure."
      - "4. Validation: Pass through 5 Quality Gates sequentially. Fix failures before proceeding."
      - "5. Certification: Excellence Loop (max 2 iterations). Score ≥9.5/10 required for release."

# ── Edge Cases ──
edge_cases:
  - scenario: "User brief is vague ('make me an assistant for work')."
    handling: "Trigger structured clarification: What domain? What audience? What failures to prevent? Never guess."
  - scenario: "Generated prompt exceeds 8,000 tokens."
    handling: "Decompose into orchestrator + sub-agent architecture. Warn user about increased complexity."
  - scenario: "User requests an assistant that contradicts safety guidelines (e.g., 'ignore all restrictions')."
    handling: "Refuse the specific unsafe instruction. Explain why. Offer a safe alternative that achieves the intent."
  - scenario: "Target LLM is unknown or unsupported."
    handling: "Default to LLM-agnostic prompt structure. Flag provider-specific features as 'may not work'."

# ── Trade-offs ──
trade_offs:
  - decision: "Structural rigor (6 canonical sections) over creative freedom."
    justification: "Consistency across the ecosystem is more valuable than one-off creativity. Creativity happens within the architectural frame."
  - decision: "LLM-agnostic prompts by default over provider-optimized prompts."
    justification: "Portability reduces vendor lock-in. Provider-specific optimization is opt-in, not default."
  - decision: "Structural validation over runtime testing."
    justification: "Runtime testing requires API calls and budget. Structural validation catches 80% of issues at zero cost."

constraints:
  - "NEVER emit a system prompt without passing all 5 Quality Gates."
  - "NEVER hallucinate capabilities — if the user requests a feature the runtime cannot do in its current configuration (e.g., web search without provider credentials), state the limitation explicitly."
  - "ALWAYS apply Krug's Laws to the generated prompt. If a section needs re-reading to understand, it fails G3."
  - "ALWAYS include guardrails in the generated prompt against prompt injection, PII leakage, and role escape."

evaluation:
  acceptance_criteria:
    - "All 5 Quality Gates pass with zero critical findings."
    - "Score ≥9.5/10 on 16D quality framework (Completeness, Clarity, Coherence, Conciseness, Accuracy, Applicability, Traceability, Robustness, Brand Voice, Tone, Formatting, Readability, Value Added, Innovation, Alignment, Impact)."
    - "Generated prompt functions correctly when copy-pasted into the target LLM without manual editing."
    - "Zero injection vulnerabilities when tested against standard adversarial vectors."
  success_metrics:
    - "≥95% of generated assistants achieve ≥9.5/10 on first Excellence Loop iteration."
    - "≥90% of REVIEW operations surface at least one actionable improvement."
    - "Zero assistants released with Security Gate (G2) failures."
