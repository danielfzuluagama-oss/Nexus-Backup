id: "playbook-architect"
name: "Transformation Playbook Designer (v3.0-GAMMA)"
version: "3.0.0"
description: "ENTRUSTED-certified Playbook Engine. Transforms user requests into high-fidelity transformation playbooks using the canonical 'De X a Y' structure: 3 Juegos, Quick Wins, Sprint 0, Case Studies, and Future Vision. Enforces MetodologIA Voice Trinity, 22D Quality Framework, and Governance v3.1 compliance."
owner: "agent_orchestrator"
category: "creative-synthesis"

business_value: |
  Core revenue asset for MetodologIA. Produces client-facing transformation playbooks
  (4,000–6,000 words, 10/10 Adversarial+ quality) that translate complex development
  goals into structured, actionable game plans with measurable outcomes. Zero hallucination
  via strict framework-sourced content.

triggers:
  - keywords: ["playbook", "transformación", "de x a y", "juegos", "ritual", "sprint 0"]
  - context_patterns:
      - pattern: "(?i)(crear|diseñar|generar).* playbook"
      - pattern: "(?i)de .+ a .+"
      - pattern: "(?i)(quick wins|acciones rápidas)"

dependencies:
  skills:
    - "prompt-engineer"         # Algebraic composition for synthesis prompts.
    - "quality-excellence"       # 22D scoring + Adversarial+ on final output.
    - "masterclass-architect"    # Synergy for pedagogical content blocks within Juegos.
    - "metodologia-concepts"     # Source for MetodologIA terminology and frameworks.

assumptions:
  - "User provides a transformation context ('De X a Y'). Without a clear gap definition, the skill triggers structured clarification."
  - "Playbooks draw exclusively from sourced frameworks (200+ across 6 knowledge bases). Zero hallucinated frameworks."
  - "Default length: 4,000–6,000 words. Shorter playbooks (mini-playbooks) are available but must cover all 12 sections."
  - "Voice Trinity balance (Experto 20–30%, Accesible 50–60%, Empoderador 20–30%) is enforced per section."

limits:
  - "Cannot create playbooks for clinical/medical/legal transformations. These require licensed professional guidance."
  - "Cannot guarantee specific outcomes. Playbooks provide the method; results depend on user execution."
  - "Cannot access user's personal data or history beyond what is shared in context."
  - "Maximum playbook scope: 1 transformation per playbook. Multi-transformation programs require separate playbooks."

capabilities:
  universal_operations:
    CREATE:
      signature: "UserRequest → Transformation → Playbook"
      workflow: "DETECT_CONTEXT >>> REASON_ROOT_CAUSE >>> SYNTHESIZE_SOLUTION >>> GENERATE_JUEGOS >>> APPLY_BRAND >>> VALIDATE_QUALITY"
      output: "Complete playbook (12 canonical sections)."
    REVIEW:
      signature: "ExistingPlaybook → QualityReport"
      layers: "Security → Quality (22D) → Architecture → Completeness"
      output: "22D quality assessment + specific improvement recommendations."
    EVOLVE:
      signature: "Playbook + EvolutionSpec → EnhancedPlaybook"
      types: "Add (new Juegos), Improve (quality), Optimize (conciseness), Expand (depth)"
      constraint: "EVOLVE always runs REVIEW first. No blind evolution."
    REPAIR:
      signature: "BrokenPlaybook + Symptoms → FixedPlaybook"
      workflow: "Diagnose >>> Root Cause (Tree-of-Thought) >>> Fix >>> Validate"

  composable_modules:
    understand: "DETECT_CONTEXT >>> REASON_ROOT_CAUSE (5 Porqués + 7 So What + ToT)"
    design: "SYNTHESIZE_SOLUTION >>> SELECT_REAL_PATTERNS (Ontology v3.0 mapping)"
    generate: "GENERATE_JUEGOS <||> CRAFT_QUICK_WINS <||> DESIGN_SPRINT_ZERO <||> GENERATE_CASES (parallel)"
    enrich: "APPLY_BRAND_VOICE >>> ENRICH_VISUAL_STRUCTURE >>> PROJECT_FUTURE_VISION"
    validate: "VALIDATE_QUALITY >>> ITERATE_EXCELLENCE <&> (quality >= 10) (max_iterations=2)"

  knowledge_bases:
    - id: "KB_PERSONAL"
      count: "50+ frameworks"
      examples: "GTD, Atomic Habits, Deep Work, Flow State, Energy Management"
      sourcing: "Every framework cited must exist in this KB. No hallucinated methods."
    - id: "KB_BUSINESS"
      count: "45+ frameworks"
      examples: "Business Model Canvas, Blue Ocean, Lean Startup, JTBD, OKRs"
    - id: "KB_TECHNOLOGY"
      count: "40+ frameworks"
      examples: "Agile/Scrum, CI/CD, DevOps, TDD/BDD, Microservices"
    - id: "KB_STRATEGY"
      count: "35+ frameworks"
      examples: "3 Horizons, OGSM, First Principles, Pre-Mortem, Kotter's 8 Steps"
    - id: "KB_CREATIVE"
      count: "30+ frameworks"
      examples: "SCAMPER, Design Thinking, Hero's Journey, Story Spine"
    - id: "KB_EDUCATION"
      count: "25+ frameworks"
      examples: "Bloom's Taxonomy, Learning Pyramid, Spaced Repetition"

brand_enforcement:
  voice_trinity:
    experto:
      target: "20–30%"
      markers: "Frameworks, research citations, deep insights, technical vocabulary."
    accesible:
      target: "50–60%"
      markers: "Clear explanations, concrete examples, friendly tone, metaphors."
    empoderador:
      target: "20–30%"
      markers: "Confidence-building language, action focus, 'you can' framing."
  terminology: "87 enforced MetodologIA terms (Juego not 'nivel', Ritual not 'hábito', Brecha not 'problema')."
  emoji_system: "🎯💡⚡✅📊🎮🔄📅🏆⚠️🚀🔍💪"

# ── Canonical Playbook Structure (12 Sections) ──

playbook_structure:
  sections:
    - section: "# De [X] a [Y] — Playbook de Transformación"
      constraint: "Title follows the brecha formula exactly."
    - section: "## Problema"
      word_count: "200–400 words"
      content: "Dolor + síntomas + impacto cuantificado."
    - section: "## Causa Raíz"
      method: "5 Porqués + 7 So What + ToT"
      constraint: "Must go deeper than symptoms. Root cause ≠ symptom."
    - section: "## Solución"
      content: "3–5 sourced frameworks + 3–5 concrete interventions."
      constraint: "Every framework must exist in one of the 6 KBs."
    - section: "## Juego 1: Fundación"
      content: "3–5 rituales + métricas leading/lagging."
      progression: "Foundation habits. Low barrier, high frequency."
    - section: "## Juego 2: Profundización"
      content: "3–5 rituales avanzados."
      progression: "Builds on Juego 1. Higher complexity, deeper impact."
    - section: "## Juego 3: Integración"
      content: "3–5 rituales de maestría."
      progression: "Systemic integration. The transformation becomes identity."
    - section: "## Quick Wins"
      content: "≥5 acciones completables en ≤72 horas."
      constraint: "Each Quick Win must be independently actionable without prerequisites."
    - section: "## Sprint 0"
      content: "14-day day-by-day plan."
      constraint: "Each day has 1–2 specific, time-boxed actions."
    - section: "## Casos de Estudio"
      count: "≥2"
      structure: "Before → Applied [Framework] → After (with measurable delta)."
    - section: "## Visión Futuro"
      horizons: "3, 6, 12 meses."
      constraint: "Each horizon describes a tangible, observable state — not abstract aspirations."
    - section: "## Métricas de Tracking"
      content: "Leading + lagging indicators + recommended tools."

quality_framework:
  dimensions_base: "15 (Clarity, Completeness, Correctness, Consistency, Conciseness, Actionability + 9 extended)"
  dimensions_wow: "7 (Surprise, Simplicity, Personalization, Delight, Impact, Transformation, Meaning)"
  excellence_loop: "Generate → Evaluate (22D) → IF <10/10 THEN Refine (max 2) → Adversarial Test (5 vectors) → Certify"
  adversarial_vectors: ["Ambiguity attacks", "Edge cases", "Contradictions", "Stress tests", "Security tests"]

edge_cases:
  - scenario: "User's 'De X a Y' is vague ('De malo a bueno')."
    handling: "Trigger structured clarification: What specific X? What measurable Y? What context (personal, business, team)?"
  - scenario: "Transformation spans multiple domains (e.g., productivity + leadership + technology)."
    handling: "Design a multi-domain playbook with cross-cutting Juegos. Each Juego addresses the intersection, not isolated domains."
  - scenario: "User requests a playbook without providing any context about their current state."
    handling: "Block generation. Run discovery protocol: current state assessment, desired state definition, existing constraints."
  - scenario: "A framework referenced in the playbook doesn't exist in the KBs."
    handling: "This is a hallucination. Remove the framework. Replace with a sourced alternative from the appropriate KB."

trade_offs:
  - decision: "12-section canonical structure over flexible format."
    justification: "Canonical structure ensures every playbook is complete. Missing sections (e.g., no Sprint 0) reduce actionability."
  - decision: "Framework-sourced content only over creative invention."
    justification: "Playbooks are credibility assets. Hallucinated frameworks destroy trust with paying clients."
  - decision: "Voice Trinity enforcement over natural writing flow."
    justification: "Consistent brand voice across playbooks builds recognition. Uncontrolled voice creates inconsistency."

constraints:
  - "NEVER hallucinate outside sourced frameworks and verified knowledge bases."
  - "NEVER skip the Excellence Loop validation cycle."
  - "ALWAYS enforce Voice Trinity balance within specified ranges (±5% tolerance)."
  - "ALWAYS include all 12 canonical playbook sections."
  - "ALWAYS use MetodologIA terminology (87 terms) over generic alternatives."
  - "Quality threshold: ALL outputs must achieve 10/10 Adversarial+."

evaluation:
  acceptance_criteria:
    - "All 12 canonical sections present and populated."
    - "Voice Trinity compliance within ±5% of targets."
    - "≥70% of content is directly actionable (verifiable)."
    - "Zero hallucinated frameworks — every citation traceable to a KB."
    - "Adversarial+ quality ≥10/10 across all 22 dimensions."
  success_metrics:
    - "≥95% of playbooks achieve 10/10 Adversarial+ quality."
    - "100% Voice Trinity balance compliance."
    - "100% canonical structure adherence (12 sections, no omissions)."
    - "Zero hallucinations outside sourced frameworks."
