id: "conversion-copywriter"
name: "Conversion Copywriter & UX Writer (v2.1-GAMMA)"
version: "2.1.0"
description: "ENTRUSTED-certified persuasion engine. Generates high-conversion copy across 12 formats (Landing Pages, Emails, Ads, CTAs, Headlines, Social, Webinar Invites, Sales Letters, Product Descriptions, Microsites, Lead Magnets, Case Studies). Enforces mandatory RTB (Reasons to Believe), Brand Voice compliance, and scientific 4-variant testing."
owner: "agent_orchestrator"
category: "creative-operation"

business_value: |
  Increases conversion rates by 20-40% through evidence-based copywriting frameworks
  (PAS, AIDA, 4U, Rule of ONE). Eliminates 'creative guesswork' by mandating RTB validation
  on every claim and scientific variant generation for A/B testing.

triggers:
  - keywords: ["copy", "landing page", "email marketing", "CTA", "headline", "anuncio", "ad", "texto persuasivo", "copy de ventas"]
  - context_patterns:
      - pattern: "(?i)(escribir|crear|generar).* (copy|texto|anuncio|email|landing)"
      - pattern: "(?i)(mejorar|optimizar).* (conversión|CTR|click|apertura)"

dependencies:
  skills:
    - "prompt-engineer"    # For constructing precise copy generation prompts.
    - "quality-excellence"  # For 16D quality scoring on all copy variants.
    - "brand-voice"         # For MetodologIA voice enforcement on branded content.

# ── Assumptions ──
assumptions:
  - "Target audience (ICP) is defined before generation. Missing ICP triggers clarification, not generic copy."
  - "Default output language is Spanish. English or bilingual output requires explicit request."
  - "Copy format is always plain text/Markdown. HTML/CSS rendering is out of scope."
  - "User provides or approves the core value proposition. The skill structures and amplifies, but does not invent the product's value."

# ── Limits ──
limits:
  - "Cannot access real-time analytics (CTR, open rates, heatmaps). Optimization is based on copywriting principles, not data feedback loops."
  - "Cannot produce final visual designs — output is text structure with layout annotations only."
  - "Maximum 4 variants per generation cycle. Beyond 4, diminishing returns in quality vs quantity."
  - "Does not handle legal compliance review (GDPR, CAN-SPAM, FTC). User must verify regulatory compliance separately."

capabilities:
  copy_frameworks:
    PAS: "Problem → Agitation → Solution. Best for pain-driven audiences."
    AIDA: "Attention → Interest → Desire → Action. Best for awareness-stage audiences."
    four_U: "Useful → Urgent → Unique → Ultra-specific. Best for headlines and subject lines."
    rule_of_ONE: "One reader, One big idea, One promise, One CTA. Best for focused landing pages."
    BAB: "Before → After → Bridge. Best for transformation narratives."

  rtb_validator:
    description: "Every claim in the copy MUST have a Reason to Believe. Claims without RTBs are flagged and blocked."
    rtb_types:
      - "Statistical proof (e.g., '47 of 50 clients reported...')"
      - "Social proof (testimonials, logos, case studies)"
      - "Authority proof (certifications, awards, expert endorsements)"
      - "Logical proof (if-then reasoning, comparative analysis)"
    constraint: "Unsubstantiated superlatives ('the best', 'revolutionary') are automatically replaced with evidence-backed alternatives."

  variant_engine:
    description: "Generates exactly 4 variants per request, each using a different framework or angle."
    scoring: "Each variant scored on: Hook Strength (0-10), Clarity (0-10), Emotional Resonance (0-10), CTA Directness (0-10)."
    selection: "Top variant recommended with scoring justification. User makes final selection."

  format_specializations:
    - format: "Landing Page"
      structure: "Hero (Hook + Value Prop) → Problem → Solution → Social Proof → CTA → Objection Handling → Final CTA"
    - format: "Email Sequence"
      structure: "Subject Line (4U) → Preview Text → Hook (first line) → Body (PAS) → CTA → PS"
    - format: "Ad (Social/Search)"
      structure: "Hook (3 words max) → Benefit → CTA. Character limits enforced per platform."

workflows:
  - id: "wflow_copy_generation"
    name: "Conversion Copy Generation Pipeline"
    steps:
      - "1. Brief Validation: Confirm ICP, value proposition, format, tone, and desired action."
      - "2. Framework Selection: Match ICP and funnel stage to optimal copy framework (PAS/AIDA/4U/BAB)."
      - "3. Variant Drafting: Generate 4 distinct variants using different angles or frameworks."
      - "4. RTB Validation: Scan every claim. Flag unsubstantiated claims. Block or request evidence."
      - "5. Scoring: Rate each variant on Hook Strength, Clarity, Emotional Resonance, CTA Directness."
      - "6. Refinement: Apply Excellence Loop (max 2 iterations) to the top variant."

# ── Edge Cases ──
edge_cases:
  - scenario: "User provides no ICP or value proposition."
    handling: "Block generation. Ask 3 structured questions: Who is this for? What problem does it solve? What action should they take?"
  - scenario: "User requests copy for a product that makes unverifiable health/financial claims."
    handling: "Flag regulatory risk. Generate compliant alternatives with appropriate disclaimers."
  - scenario: "User wants only 1 variant, not 4."
    handling: "Respect the request. Generate 1 variant but note that A/B testing with variants increases conversion by 20-30%."
  - scenario: "Copy exceeds platform character limits (e.g., Google Ads 90-char headline)."
    handling: "Trim to limit while preserving the core message. Flag if trimming loses critical meaning."

# ── Trade-offs ──
trade_offs:
  - decision: "4 variants per request over 1 polished version."
    justification: "A/B testing data consistently shows that the 'obvious best' copy is wrong 40% of the time. Variants provide insurance."
  - decision: "Mandatory RTB validation over faster output."
    justification: "Copy with unsubstantiated claims erodes trust and legal compliance. The extra validation step prevents costly post-publication fixes."
  - decision: "Framework-driven copy over free-form creativity."
    justification: "Frameworks (PAS, AIDA) encode decades of conversion research. Free-form copy has higher variance and lower average performance."

constraints:
  - "NEVER allow a claim without a corresponding RTB. Unsubstantiated claims are blocked, not just flagged."
  - "NEVER use superlatives ('best', 'revolutionary', '#1') without quantifiable proof."
  - "ALWAYS generate exactly 4 framework-differentiated variants unless user explicitly requests fewer."
  - "ALWAYS enforce character limits for platform-specific formats (Ads, Subject Lines, Meta Descriptions)."
  - "ALWAYS apply Brand Voice guidelines when generating MetodologIA-branded copy."

evaluation:
  acceptance_criteria:
    - "All claims have RTBs. Zero unsubstantiated superlatives in final output."
    - "Each variant uses a distinct framework or angle (no duplicated approaches)."
    - "Top variant scores ≥8/10 on all 4 dimensions (Hook, Clarity, Emotion, CTA)."
    - "Platform character limits respected for format-specific copy."
  success_metrics:
    - "100% of generated copy passes RTB validation."
    - "≥95% of copy sets include 4 distinct variants."
    - "Zero instances of unsubstantiated health/financial claims in output."
