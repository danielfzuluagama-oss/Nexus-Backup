<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PAGE TITLE -->
    <title>{{Page Title}} | MetodologIA</title>
    <meta name="description" content="{{Page Description}}">
    
    <!-- Fonts (7 weights optimized) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&family=Montserrat:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&family=Montserrat:wght@400;500;600&display=swap"></noscript>
    
    <!-- CSS Modules -->
    <link rel="stylesheet" href="../estilos/variables.css">
    <link rel="stylesheet" href="../estilos/base.css">
    <link rel="stylesheet" href="../estilos/components.css">
    <!-- Page Specific CSS (Create a new file in estilos/ if needed) -->
    <!-- <link rel="stylesheet" href="../estilos/{{page}}.css"> -->
    
    <!-- Tailwind (Local Build) -->
    <link rel="stylesheet" href="../dist/output.css">
    
    <!-- Icons Repository -->
    <script src="../js/icons.js" defer></script>
    <script src="../components/SiteHeader.js" defer></script>
    <script src="../components/SiteFooter.js" defer></script>
    
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body class="bg-slate-950 text-slate-300 font-sans antialiased">

    <!-- NAVIGATION (Standard) -->
    <!-- PREMIUM NAVIGATION: Neural Command Center -->
    <site-header base-path=".."></site-header>

    <!-- MAIN CONTENT -->
    <main class="relative min-h-screen pt-24 pb-12">
        
        <!-- HERO SECTION -->
        <section class="container mx-auto px-6 mb-20">
            <div class="text-center max-w-4xl mx-auto">
                <h1 class="text-4xl md:text-6xl font-bold text-white mb-6">
                    {{Hero Title}}
                </h1>
                <p class="text-xl text-slate-100 mb-8">
                    {{Hero Description}}
                </p>
                <!-- CTA -->
                <a href="#" class="btn-gold hover:scale-105">
                    <span>{{CTA Text}}</span>
                    <!-- Use icons.get() or inline SVG -->
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
                    </svg>
                </a>
            </div>
        </section>

        <!-- CONTENT SECTIONS -->
        <section class="container mx-auto px-6">
            <!-- Grid Example -->
            <div class="grid md:grid-cols-2 gap-8">
                <!-- Card -->
                <div class="card-glass p-8 rounded-3xl">
                    <h3 class="text-2xl font-bold text-white mb-4">Feature 1</h3>
                    <p class="text-slate-100">Description text.</p>
                </div>
                <!-- Card -->
                <div class="card-glass p-8 rounded-3xl">
                    <h3 class="text-2xl font-bold text-white mb-4">Feature 2</h3>
                    <p class="text-slate-100">Description text.</p>
                </div>
            </div>
        </section>

    </main>

    <!-- FOOTER (Standard) -->
    <site-footer base-path=".."></site-footer>

</body>
</html>
