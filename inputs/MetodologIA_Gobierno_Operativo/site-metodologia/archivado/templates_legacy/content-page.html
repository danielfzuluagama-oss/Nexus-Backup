<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PAGE TITLE -->
    <title>{{Page Title}} | MetodologIA</title>
    <meta name="description" content="{{Page Description}}">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&family=Montserrat:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&family=Montserrat:wght@400;500;600&display=swap"></noscript>
    
    <!-- CSS Modules -->
    <link rel="stylesheet" href="../estilos/variables.css">
    <link rel="stylesheet" href="../estilos/base.css">
    <link rel="stylesheet" href="../estilos/components.css">
    
    <!-- Tailwind (Local Build) -->
    <link rel="stylesheet" href="../dist/output.css">
    
    <!-- Icons Repository -->
    <script src="../js/icons.js" defer></script>
    <script src="../components/SiteHeader.js" defer></script>
    <script src="../components/SiteFooter.js" defer></script>
    
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body class="bg-slate-950 text-slate-300 font-sans antialiased">

    <!-- NAVIGATION (Relative Path adjusted) -->
    <!-- PREMIUM NAVIGATION: Neural Command Center -->
    <site-header base-path=".."></site-header>

    <!-- CONTENT WRAPPER -->
    <main class="min-h-screen pt-32 pb-24 px-6 relative">
        
        <!-- Breadcrumbs -->
        <nav aria-label="Breadcrumb" class="container mx-auto max-w-4xl mb-8">
            <ol class="flex items-center space-x-2 text-xs md:text-sm text-slate-200">
                <li><a href="../index.html" class="hover:text-brand-gold transition-colors">Inicio</a></li>
                <li><span>/</span></li>
                <li><a href="#" class="hover:text-brand-gold transition-colors">{{Category}}</a></li>
                <li><span>/</span></li>
                <li class="text-slate-300 font-medium" aria-current="page">{{Current Page}}</li>
            </ol>
        </nav>

        <!-- PAGE HEADER -->
        <header class="container mx-auto max-w-4xl text-center mb-16">
            <h1 class="text-4xl md:text-5xl font-extrabold text-white mb-6">
                {{Page Title}}
            </h1>
            <p class="text-lg text-slate-100 max-w-2xl mx-auto">
                {{Page Subtitle or Intro}}
            </p>
        </header>

        <!-- ARTICLE / DESCRIPTION -->
        <article class="container mx-auto max-w-4xl space-y-8 text-slate-300 leading-relaxed">
            
            <!-- Standard Paragraph Block -->
            <div class="bg-slate-900/30 border border-white/5 rounded-2xl p-8">
                <h2 class="text-2xl font-bold text-white mb-4">{{Section Title}}</h2>
                <p>
                    {{Content goes here. Use standard typography classes.}}
                </p>
            </div>
            
            <!-- Add more content blocks as needed -->

        </article>
    </main>

    <!-- FOOTER -->
    <site-footer base-path=".."></site-footer>
    
    <!-- Initialize Icons -->
    <script>
        window.icons.createIcons();
    </script>

</body>
</html>
